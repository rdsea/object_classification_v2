[project]
name = "llm_service"
version = "0.0.1"
description = "Adapter exposing an Ollama/vLLM model on the ensemble's /inference contract"
requires-python = "== 3.10.18"

dependencies = [
  "fastapi[standard]>=0.111.1",
  "uvicorn[standard]>=0.30.3",
  "aiohttp>=3.9.5",
  "python-multipart",
  "ollama>=0.1.7",
  "Pillow>=10.2.0",
  "openlit",
  "opentelemetry-distro>=0.48b0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-aiohttp-client>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "util",
]

[tool.uv.sources]
util = { workspace = true }
